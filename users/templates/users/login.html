{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Vístete - Iniciar Sesión</title>
    <!-- Bootstrap CSS -->
    <link href="{% static 'css/login.css' %}" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="{% static 'js/login.js' %}"></script>

</head>
<body>
    <div class="login-container">
        <div class="brand">
            <img src="{% static 'img/logo.png' %}" alt="R-Vístete Logo" class="logo">
        </div>
        
        
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}
        
        <form method="POST" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="correo" name="correo" 
                           value="{{ correo|default:'' }}" required>
                </div>
                <div class="invalid-feedback">
                    Por favor ingresa un correo válido.
                </div>
            </div>
            
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                </div>
                <div class="invalid-feedback">
                    Por favor ingresa tu contraseña.
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
            </button>
            
            <div class="text-center">
                <a href="#" class="text-decoration-none text-success">¿Olvidaste tu contraseña?</a>
                <p class="mt-3">¿No tienes una cuenta? <a href="#" class="text-decoration-none text-success">Regístrate</a></p>
            </div>
        </form>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
