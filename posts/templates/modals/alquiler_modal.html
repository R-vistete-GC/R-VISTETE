<!-- Modal de Alquiler -->
<div class="modal fade" id="modalAlquiler" tabindex="-1" aria-labelledby="modalAlquilerLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalAlquilerLabel">Alquilar Prenda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="alquilerForm" method="post" action="{% url 'posts:procesar_alquiler' %}">
                    {% csrf_token %}
                    <!-- Campo oculto para el ID de la publicación -->
                    <input type="hidden" id="alquilerPublicacionId" name="publicacion_id">

                    <!-- Imagen de la prenda -->
                    <div class="text-center mb-3">
                        <img id="modalImagenPrendaAlquiler" src="" alt="Imagen de la prenda" class="img-fluid" style="max-height: 200px;">
                    </div>

                    <!-- Título de la prenda -->
                    <h5 id="modalTituloPrendaAlquiler" class="text-center"></h5>

                    <!-- Resumen de precios -->
                    <div class="mt-3">
                        <p><strong>Precio por día:</strong> <span id="alquilerPrecioDia"></span></p>
                        <p><strong>Depósito:</strong> <span id="alquilerDeposito"></span></p>
                    </div>

                    <!-- Fechas de alquiler -->
                    <div class="mb-3">
                        <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
                        <input type="date" class="form-control" id="fechaInicio" name="fecha_inicio" required>
                    </div>
                    <div class="mb-3">
                        <label for="fechaFin" class="form-label">Fecha de Fin</label>
                        <input type="date" class="form-control" id="fechaFin" name="fecha_fin" required>
                    </div>

                    <!-- Resumen de cálculo -->
                    <div class="mt-3">
                        <p><strong>Días totales:</strong> <span id="alquilerDiasTotales">-</span></p>
                        <p><strong>Subtotal:</strong> <span id="alquilerSubtotal">-</span></p>
                        <p><strong>Total:</strong> <span id="alquilerTotal">-</span></p>
                    </div>

                    <!-- Dirección de envío -->
                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección de Envío</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" required>
                    </div>

                    <!-- Método de pago -->
                    <div class="mb-3">
                        <label for="metodoPago" class="form-label">Método de Pago</label>
                        <select class="form-select" id="metodoPago" name="metodo_pago" required>
                            <option value="tarjeta">Tarjeta de Crédito</option>
                            <option value="paypal">PayPal</option>
                        </select>
                    </div>

                    <!-- Notas adicionales -->
                    <div class="mb-3">
                        <label for="notas" class="form-label">Notas</label>
                        <textarea class="form-control" id="notas" name="notas" rows="3"></textarea>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Confirmar Alquiler</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
