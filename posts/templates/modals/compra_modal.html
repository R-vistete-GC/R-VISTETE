<!-- Modal de Compra -->
<div class="modal fade" id="modalCompra" tabindex="-1" aria-labelledby="modalCompraLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCompraLabel">Comprar Prenda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formCompra" method="post" action="{% url 'posts:procesar_compra' %}">
                    {% csrf_token %}
                    <!-- Campos ocultos requeridos -->
                    <input type="hidden" id="publicacionId" name="publicacion_id">
                    <input type="hidden" id="vendedorId" name="vendedor_id">
                    <input type="hidden" id="precioFinal" name="precio_final">
                    <input type="hidden" id="estado" name="estado" value="pendiente">

                    <!-- Imagen y título de la prenda -->
                    <div class="text-center mb-3">
                        <img id="modalImagenPrenda" src="" alt="Imagen de la prenda" class="img-fluid mb-2">
                        <h5 id="modalTituloPrenda" class="mb-3"></h5>
                    </div>

                    <!-- Resumen de precios -->
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6">Precio base:</div>
                                <div class="col-6 text-end" id="modalPrecioPrenda"></div>
                            </div>
                            <div class="row">
                                <div class="col-6">Envío:</div>
                                <div class="col-6 text-end" id="costoEnvio">$5.00</div>
                            </div>
                            <hr>
                            <div class="row fw-bold">
                                <div class="col-6">Total:</div>
                                <div class="col-6 text-end" id="total"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Método de pago -->
                    <div class="mb-3">
                        <label for="metodo_pago" class="form-label">Método de Pago *</label>
                        <select class="form-select" id="metodo_pago" name="metodo_pago" required>
                            <option value="">Seleccione un método de pago</option>
                            <option value="tarjeta">Tarjeta de Crédito</option>
                            <option value="paypal">PayPal</option>
                            <option value="transferencia">Transferencia Bancaria</option>
                        </select>
                    </div>

                    <!-- Dirección de envío -->
                    <div class="mb-3">
                        <label for="direccion_envio" class="form-label">Dirección de Envío *</label>
                        <textarea class="form-control" id="direccion_envio" name="direccion_envio" rows="3" required></textarea>
                    </div>

                    <!-- Notas adicionales -->
                    <div class="mb-3">
                        <label for="notas" class="form-label">Notas Adicionales</label>
                        <textarea class="form-control" id="notas" name="notas" rows="2"></textarea>
                    </div>

                    <!-- Tracking de envío (opcional, se llenará después) -->
                    <input type="hidden" id="tracking_envio" name="tracking_envio">

                    <!-- Términos y condiciones -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terminos" required>
                        <label class="form-check-label" for="terminos">
                            Acepto los términos y condiciones de compra
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="formCompra" class="btn btn-primary">
                    Confirmar Compra
                </button>
            </div>
        </div>
    </div>
</div>
