<!-- Modal de Compra -->
<div class="modal fade" id="modalCompra" tabindex="-1" aria-labelledby="modalCompraLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCompraLabel">Comprar Prenda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formCompraAlquiler" method="post" action="{% url 'posts:procesar_compra' %}">
                    {% csrf_token %}
                    <!-- Campos ocultos necesarios -->
                    <input type="hidden" id="publicacionId" name="publicacion_id">
                    <input type="hidden" id="vendedorId" name="vendedor_id">
                    
                    <!-- Campos existentes -->
                    <div class="text-center mb-3">
                        <img id="modalImagenPrenda" src="" alt="Imagen de la prenda" class="img-fluid">
                    </div>
                    
                    <!-- Información de precios -->
                    <div class="mt-3">
                        <p><strong>Precio:</strong> <span id="modalPrecioPrenda"></span></p>
                        <p><strong>Envío:</strong> <span id="costoEnvio">$5.00</span></p>
                        <p><strong>Subtotal:</strong> <span id="subtotal"></span></p>
                        <p><strong>Total:</strong> <span id="total"></span></p>
                    </div>

                    <!-- Estado inicial -->
                    <input type="hidden" name="estado" value="pendiente">
                    
                    <!-- Campos requeridos según el modelo -->
                    <div class="mb-3">
                        <label for="direccion_envio" class="form-label">Dirección de Envío</label>
                        <input type="text" class="form-control" id="direccion_envio" name="direccion_envio" required>
                    </div>

                    <div class="mb-3">
                        <label for="metodo_pago" class="form-label">Método de Pago</label>
                        <select class="form-select" id="metodo_pago" name="metodo_pago" required>
                            <option value="tarjeta">Tarjeta de Crédito</option>
                            <option value="paypal">PayPal</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="notas" class="form-label">Notas Adicionales</label>
                        <textarea class="form-control" id="notas" name="notas" rows="3"></textarea>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Confirmar Compra</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
