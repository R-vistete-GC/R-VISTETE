{% extends 'base.html' %}
{% load static %}

{% block title %}Publicar Prenda - R-Vístete{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3>Publicar Nueva Prenda</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data" id="publicarForm">
                {% csrf_token %}
                
                <!-- Título -->
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título*</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" required>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                </div>

                <!-- Imagen -->
                <div class="mb-3">
                    <label for="imagen" class="form-label">Imagen de la prenda</label>
                    <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                </div>

                <!-- Tipo de Publicación -->
                <div class="mb-3">
                    <label class="form-label">Tipo de Publicación*</label>
                    <select class="form-control" name="tipo" required>
                        <option value="venta">Venta</option>
                        <option value="alquiler">Alquiler</option>
                    </select>
                </div>

                <!-- Precio -->
                <div class="mb-3">
                    <label for="precio" class="form-label">Precio*</label>
                    <input type="number" class="form-control" id="precio" name="precio" step="0.01" required>
                </div>

                <!-- Depósito (para alquiler) -->
                <div class="mb-3" id="depositoContainer" style="display: none;">
                    <label for="deposito" class="form-label">Depósito de Seguridad</label>
                    <input type="number" class="form-control" id="deposito" name="deposito" step="0.01">
                </div>

                <!-- Público -->
                <div class="mb-3">
                    <label class="form-label">Público Objetivo*</label>
                    <select class="form-control" name="publico" required>
                        <option value="mujer">Mujer</option>
                        <option value="hombre">Hombre</option>
                        <option value="niño">Niño</option>
                        <option value="niña">Niña</option>
                        <option value="mascota">Mascota</option>
                    </select>
                </div>

                <!-- Talla -->
                <div class="mb-3">
                    <label class="form-label">Talla*</label>
                    <select class="form-control" name="talla" required>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>

                <!-- Estilo -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-palette text-success me-2"></i>Estilo*
                    </label>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Casual" id="estilo-casual">
                                <label class="form-check-label" for="estilo-casual">Casual</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Formal" id="estilo-formal">
                                <label class="form-check-label" for="estilo-formal">Formal</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Deportivo" id="estilo-deportivo">
                                <label class="form-check-label" for="estilo-deportivo">Deportivo</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Elegante" id="estilo-elegante">
                                <label class="form-check-label" for="estilo-elegante">Elegante</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Bohemio" id="estilo-bohemio">
                                <label class="form-check-label" for="estilo-bohemio">Bohemio</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Vintage" id="estilo-vintage">
                                <label class="form-check-label" for="estilo-vintage">Vintage</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Minimalista" id="estilo-minimalista">
                                <label class="form-check-label" for="estilo-minimalista">Minimalista</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="estilo[]" value="Streetwear" id="estilo-streetwear">
                                <label class="form-check-label" for="estilo-streetwear">Streetwear</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Colores -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-fill-drip text-success me-2"></i>Colores*
                    </label>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Negro" id="color-negro">
                                <label class="form-check-label" for="color-negro">Negro</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Blanco" id="color-blanco">
                                <label class="form-check-label" for="color-blanco">Blanco</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Rojo" id="color-rojo">
                                <label class="form-check-label" for="color-rojo">Rojo</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Azul" id="color-azul">
                                <label class="form-check-label" for="color-azul">Azul</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Verde" id="color-verde">
                                <label class="form-check-label" for="color-verde">Verde</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Amarillo" id="color-amarillo">
                                <label class="form-check-label" for="color-amarillo">Amarillo</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Rosa" id="color-rosa">
                                <label class="form-check-label" for="color-rosa">Rosa</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Morado" id="color-morado">
                                <label class="form-check-label" for="color-morado">Morado</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Marrón" id="color-marron">
                                <label class="form-check-label" for="color-marron">Marrón</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="colores[]" value="Gris" id="color-gris">
                                <label class="form-check-label" for="color-gris">Gris</label>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Publicar Prenda</button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tipoSelect = document.querySelector('select[name="tipo"]');
    const depositoContainer = document.getElementById('depositoContainer');
    const depositoInput = document.getElementById('deposito');

    tipoSelect.addEventListener('change', function() {
        if (this.value === 'alquiler') {
            depositoContainer.style.display = 'block';
            depositoInput.required = true;
        } else {
            depositoContainer.style.display = 'none';
            depositoInput.required = false;
            depositoInput.value = '';
        }
    });
});
</script>
{% endblock %}
